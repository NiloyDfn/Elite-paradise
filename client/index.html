<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Elite Paradise — Premium Jewelry &amp; Accessories in Bangladesh</title>
    <meta
      name="description"
      content="Elite Paradise — elegant necklaces, earrings, rings, bracelets and couple jewelry in 18k gold vermeil. Premium jewelry and accessories delivered across Bangladesh. Elegance in Every Detail."
    />
    <meta name="theme-color" content="#FAF8F3" />
    <link rel="canonical" href="https://eliteparadise.com.bd/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elite Paradise" />
    <meta property="og:title" content="Elite Paradise — Elegance in Every Detail" />
    <meta
      property="og:description"
      content="Discover exquisite jewelry and timeless accessories designed to make every moment extraordinary. Premium jewelry delivered across Bangladesh."
    />
    <meta property="og:locale" content="en_BD" />
    <meta property="og:image" content="/images/brand-banner.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elite Paradise — Elegance in Every Detail" />
    <meta
      name="twitter:description"
      content="Premium jewelry and accessories in Bangladesh. Elegant necklaces, earrings, rings, bracelets and couple jewelry."
    />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JewelryStore",
        "name": "Elite Paradise",
        "slogan": "Elegance in Every Detail.",
        "description": "Premium jewelry and fashion accessories — elegant necklaces, earrings, rings, bracelets, bangles, jewelry sets and couple collections.",
        "url": "https://eliteparadise.com.bd/",
        "areaServed": { "@type": "Country", "name": "Bangladesh" },
        "currenciesAccepted": "BDT",
        "priceRange": "৳৳"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
